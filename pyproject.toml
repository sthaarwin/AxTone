[project]
name = "axtone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sthaarwin", email = "sthaarwin123@gmail.com" }
]
requires-python = ">=3.11.8"
dependencies = [
    "fastapi>=0.109.0",
    "librosa>=0.10.1",
    "matplotlib>=3.8.0",
    "mido>=1.3.0",
    "numpy>=1.24.0",
    "pretty-midi>=0.2.10",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "scipy>=1.11.0",
    "setuptools>=65.0.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
axtone = "axtone:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
